services:
  - type: web
    name: alerted-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: alerted-storage
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_URL
        value: https://022e50c9cb2cd84a296eddb3a68d0e28.r2.cloudflarestorage.com/alerted-storage