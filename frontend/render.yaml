services:
  - type: web
    name: alerted-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://alertedthesis-backend.onrender.com
      - key: NEXT_PUBLIC_R2_URL
        value: https://alerted-storage.r2.cloudflarestorage.com